# Midnight — cool blues, soft glass, floating pills.

[meta]
name = "Midnight"
description = "冷色玻璃质感，悬浮胶囊状态栏，大圆角"
dark = true

[wallpaper]
path = ""   # empty → gradient from the palette; set an image path to use one

[palette]
bg = "#181926"
surface = "#24273a"
fg = "#cad3f5"
muted = "#6e738d"
accent = "#8aadf4"
accent_alt = "#c6a0f6"
urgent = "#ed8796"
border_active = "accent"
border_inactive = "#494d64"
opacity = 0.72

[shape]
radius = 14
border = 2
gaps_in = 6
gaps_out = 12
bar = "floating"
bar_position = "top"
bar_height = 34
widget = "pill"

[effects]
blur = true
shadow = true
dim_inactive = false
animation = "smooth"

[avatar]
enabled = true
pack = "sandrone"
