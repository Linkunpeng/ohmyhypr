# Porcelain — light, quiet, no avatar. Shows that every part is switchable.

[meta]
name = "Porcelain"
description = "明亮瓷白，底部状态栏，圆角卡片，无虚拟形象"
dark = false

[wallpaper]
path = ""

[palette]
bg = "#eff1f5"
surface = "#e6e9ef"
fg = "#4c4f69"
muted = "#9ca0b0"
accent = "#1e66f5"
accent_alt = "#ea76cb"
urgent = "#d20f39"
border_active = "accent"
border_inactive = "#ccd0da"
opacity = 0.9

[shape]
radius = 10
border = 1
gaps_in = 5
gaps_out = 10
bar = "floating"
bar_position = "bottom"
bar_height = 36
widget = "rounded"

[effects]
blur = false
shadow = true
dim_inactive = false
animation = "smooth"

[avatar]
enabled = false
