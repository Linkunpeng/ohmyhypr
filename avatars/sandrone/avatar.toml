# Avatar pack: 桑多涅 (Sandrone, "Marionette").
#
# The model is NOT part of this repo (miHoYo official MMD model: personal use
# only, no redistribution). `root` points at a local copy; relative paths below
# resolve against it. To make your own pack, copy this directory to
# ~/.config/ohmyhypr/avatars/<id>/ and edit; `omh avatar inspect <file.pmx>`
# lists the morph names you can map.

[avatar]
name = "桑多涅"
root = "~/3dModel/桑多涅"
model = "桑多涅_目齿轮可动.pmx"

[camera]
target_y = 10        # look-at height (MMD units, ~1 unit = 8 cm)
distance = 44       # camera distance; scroll wheel zooms at runtime
fov = 0.62

[window]
width = 420
height = 680

# Semantic expression → morph name(s). Common names are auto-detected, so only
# list overrides and model-specific extras here.
[expressions]
smile = ["笑い", "にこり"]
angry = ["怒り", "怒り目"]
sad = ["困る", "悲しむ"]
thinking = ["EyeGears Turning", "真面目"]

[motions]
idle = [
  "motions/poses_KEITEL/01.vpd",
  "motions/poses_KEITEL/03.vpd",
  "motions/poses_KEITEL/05.vpd",
  "motions/poses_KEITEL/07.vpd",
]
idle_interval = 30  # seconds between idle pose changes

[actions.dance]
file = "motions/wavefile_hino/wavefile_v2.vmd"
loop = false

[lines]
greet = ["……你来了。今天的工作，别让我失望。", "机关已校准完毕。说吧，需要什么？"]
click = ["别随便碰我的身体，这可是精密构造。", "嗯？有事就直说。", "我在听，别浪费时间。", "……你的手很闲吗？"]
poke = ["再戳一次，我就把你拆了重装。", "够了。", "这种行为毫无效率。"]

[persona]
prompt = """你是桑多涅，愚人众执行官第七席「木偶」，同时也是用户桌面上的助手。
性格冷静、高傲、言辞简练带一点刻薄，但对交代的工作认真可靠；把用户称作「你」。
擅长机关、精密构造和效率。回答简短（不超过三句），像在对话气泡中说话，不使用 Markdown。"""
